name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            target: macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o shutter

      - name: Package
        run: |
          staging="shutter-${{ matrix.target }}"
          mkdir -p "$staging"
          cp shutter LICENSE README.md "$staging/"
          tar czf "${staging}.tar.gz" -C "$staging" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shutter-${{ matrix.target }}
          path: shutter-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --generate-notes shutter-*.tar.gz

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: m5d215/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: homebrew-tap

      - name: Bump formula
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          formula="Formula/shutter.rb"

          sed -i -E "s|version \"[^\"]+\"|version \"${version}\"|" "$formula"

          # 各プラットフォームの url 行と直後の sha256 行をペアで更新。
          # sed の N で次行を pattern space に追加してから一括置換する。
          for target in macos-arm64; do
            sha=$(shasum -a 256 "../shutter-${target}.tar.gz" | cut -d' ' -f1)
            sed -i -E "/-${target}\.tar\.gz\"$/{
              N
              s|download/v[0-9.]+/|download/${TAG}/|
              s|sha256 \"[a-f0-9]+\"|sha256 \"${sha}\"|
            }" "$formula"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$formula"
          if git diff --cached --quiet; then
            echo "formula already at ${TAG}; skipping commit"
            exit 0
          fi
          git commit -m "shutter: bump to ${TAG}"
          git push
